name: Validate llms.txt Skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Validate llms.txt structure and skills
        run: |
          python scripts/validate.py ./llms.txt

      - name: Test parser and resolve
        run: |
          python scripts/parse_llms_txt_skills.py ./llms.txt --resolve

      - name: Check generated artifacts are in sync
        run: |
          python scripts/generate.py --check

      - name: Verify skill signatures
        run: |
          python scripts/verify_signatures.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CLI optional deps (BM25 engine for `memory`)
        working-directory: cli
        run: npm install --no-audit --no-fund

      - name: CLI byte-identity + round-trip tests
        working-directory: cli
        run: node test.mjs

      - name: CLI publish --check (same artifacts as generate.py)
        run: node cli/bin/llms-skills.mjs publish --check --manifest scripts/skills-manifest.json --root .

      # Signed knowledge freshness (RAG-OKF v2): fails when an attestation is
      # voided by an edit, expired, or a concept goes past its TTL
      # (docs/knowledge/freshness.yaml declares on_stale: abort).
      - name: Knowledge freshness gate (docs publisher bundle)
        run: node cli/bin/llms-skills.mjs freshness docs/knowledge

      # The spec proves its reference implementation conformant USING the kit
      # third parties get: every MUST of core + ext v0.5, driven over MCP.
      - name: Conformance kit vs published reference runtime
        run: node conformance/run.mjs --cmd "npx -y @rckflr/mcpwasm {origin}"

  # Self-test of the reusable GitHub Action (action.yml at the repo root):
  # runs the exact composite third-party publishers consume via
  # `uses: MauricioPerera/llms-txt-skills@master`, against this repo itself.
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the validation action against this repo
        uses: ./
